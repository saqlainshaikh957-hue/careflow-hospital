<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Us</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="container page-shell">
      <div class="page-nav"><a href="/">← Back to home</a></div>
      <div class="card">
        <h2>Contact CareFlow Hospital</h2>
        <p>We are available 24/7 for patient support and appointments.</p>
        <ul class="feature-list">
          <li>Phone: +234 800 000 0000</li>
          <li>Email: support@careflowhospital.com</li>
          <li>Address: 123 Medical Avenue, Lagos</li>
        </ul>
        <form id="contact-form">
          <input type="text" name="name" placeholder="Your name" required />
          <input type="email" name="email" placeholder="Your email" required />
          <textarea name="message" rows="4" placeholder="Your message" required></textarea>
          <button type="submit">Send message</button>
        </form>
        <div id="contact-message" class="message"></div>
      </div>
    </main>
  </body>
</html>
